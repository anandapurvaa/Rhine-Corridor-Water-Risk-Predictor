substitutions:
  _IMAGE: "europe-west3-docker.pkg.dev/${PROJECT_ID}/gauge24h/rhine-daily-pipeline:${BUILD_ID}"

options:
  dynamicSubstitutions: true

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.daily
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}