# To update Cloud Run, you must explicitly push the image and then deploy it.
# The 'images' block at the bottom pushes AFTER all steps finish, 
# which is too late for a deploy step inside this file to use it. 

substitutions:
  _IMAGE: "europe-west3-docker.pkg.dev/${PROJECT_ID}/gauge24h/rhine-daily-pipeline:${BUILD_ID}"
  _REGION: "europe-west3"
  # Change this to match your exact Cloud Run resource name
  _CLOUD_RUN_NAME: "rhine-daily-pipeline" 

options:
  dynamicSubstitutions: true

steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - Dockerfile.daily
      - -t
      - ${_IMAGE}
      - .

  # 2. Push the image BEFORE deploying so Cloud Run can pull it
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - ${_IMAGE}

  # 3. Update the Cloud Run Pipeline
  # NOTE: Since this is an orchestration pipeline, it is likely a Cloud Run JOB.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_CLOUD_RUN_NAME}
      - --image
      - ${_IMAGE}
      - --region
      - ${_REGION}
      - --project
      - ${PROJECT_ID}


images:
  - ${_IMAGE}
