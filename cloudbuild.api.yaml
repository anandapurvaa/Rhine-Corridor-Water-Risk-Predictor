steps:
  - name: "python:3.11-slim"
    id: "python-syntax-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        python -m compileall api modeling

  - name: "python:3.11-slim"
    id: "python-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pytest -q

  - name: "gcr.io/cloud-builders/docker"
    id: "build-api-image"
    args:
      - "build"
      - "-f"
      - "Dockerfile.api"
      - "-t"
      - "${_IMAGE}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-api-image"
    args:
      - "push"
      - "${_IMAGE}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-api-service"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--project=${PROJECT_ID}"
      - "--region=${_REGION}"
      - "--image=${_IMAGE}"
      - "--platform=managed"
      - "--port=8080"
      - "--update-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},CURATED_DATASET=rhein_curated,MLOPS_DATASET=mlops,PREDICTIONS_TABLE=gauge_24h_production_predictions,PREDICTIONS_HISTORY_TABLE=gauge_24h_prediction_history,EVALUATIONS_TABLE=gauge_24h_prediction_evaluations,STATIONS_TABLE=dim_station,GAUGE24H_SEGMENTS_CONFIG_PATH=config/segments.yaml"

images:
  - "${_IMAGE}"

substitutions:
  _REGION: "europe-west3"
  _REPOSITORY: "gauge24h"
  _SERVICE_NAME: "gauge24h-api"
  _IMAGE: "europe-west3-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/gauge24h-api:commit-${SHORT_SHA}"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

timeout: "1800s"