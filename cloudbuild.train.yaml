steps:
  - name: "python:3.11-slim"
    id: "python-syntax-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        python -m compileall modeling mlops

  - name: "gcr.io/cloud-builders/docker"
    id: "build-training-image"
    args:
      - "build"
      - "-f"
      - "Dockerfile.train"
      - "-t"
      - "${_IMAGE}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-training-image"
    args:
      - "push"
      - "${_IMAGE}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "update-training-job"
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "update"
      - "${_JOB_NAME}"
      - "--project=${PROJECT_ID}"
      - "--region=${_REGION}"
      - "--image=${_IMAGE}"

images:
  - "${_IMAGE}"

substitutions:
  _REGION: "europe-west3"
  _REPOSITORY: "gauge24h"
  _JOB_NAME: "gauge24h-train"
  _IMAGE: "europe-west3-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/gauge24h-train:build-${BUILD_ID}"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

timeout: "1800s"