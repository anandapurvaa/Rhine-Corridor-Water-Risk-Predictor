steps:
  - name: "python:3.11-slim"
    id: "python-syntax-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        python -m compileall \
          daily_pipeline.py \
          mlops \
          ingestion \
          modeling

  - name: "python:3.11-slim"
    id: "python-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pytest -q

  - name: "gcr.io/cloud-builders/docker"
    id: "build-daily-image"
    args:
      - "build"
      - "-f"
      - "Dockerfile.daily"
      - "-t"
      - "${_TEST_IMAGE}"
      - "."

substitutions:
  _REGION: "europe-west3"
  _REPOSITORY: "gauge24h"
  _TEST_IMAGE: "europe-west3-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/rhine-daily-pipeline:ci-${SHORT_SHA}"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "1800s"