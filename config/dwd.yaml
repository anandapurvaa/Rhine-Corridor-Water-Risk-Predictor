base_url: "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/hourly"

variables:
  air_temperature:
    folder: "air_temperature"
    historical_subdir: "historical"
    recent_subdir: "recent"
    station_description_file: "TU_Stundenwerte_Beschreibung_Stationen.txt"

  precipitation:
    folder: "precipitation"
    historical_subdir: "historical"
    recent_subdir: "recent"
    station_description_file: "RR_Stundenwerte_Beschreibung_Stationen.txt"

  pressure:
    folder: "pressure"
    historical_subdir: "historical"
    recent_subdir: "recent"
    station_description_file: "P0_Stundenwerte_Beschreibung_Stationen.txt"

  wind:
    folder: "wind"
    historical_subdir: "historical"
    recent_subdir: "recent"
    station_description_file: "FF_Stundenwerte_Beschreibung_Stationen.txt"

raw_output_dir: "data/raw/dwd_hourly"
timezone_name: "UTC"
historical_start_date: "2018-01-01"
incremental_table_name: "dwd_hourly_observations"
incremental_lookback_hours: 48
default_run_mode: "recent"

min_variable_families: 4
min_feature_overlap_ratio: 0.80

# Historical data has many rows per station.
min_fully_populated_rows: 5000

# Recent mode only contains the incremental lookback window.
recent_min_fully_populated_rows: 24

target_station_ids:
  # Core Rhine corridor anchors
  - "02712"   # Konstanz
  - "05906"   # Mannheim
  - "03137"   # Mainz
  - "02667"   # Köln/Bonn
  - "01078"   # Düsseldorf
  - "00161"   # Andernach
  - "01420"   # Frankfurt/Main
  - "02522"   # Karlsruhe

  # Regional support / proxy-capable inland stations
  - "15000"   # Aachen-Orsbach
  - "01303"   # Essen-Bredeney
  - "00003"   # Aachen
  - "00150"   # Alzey
  - "00216"   # Attendorn-Neulisternohl

  # Corridor support
