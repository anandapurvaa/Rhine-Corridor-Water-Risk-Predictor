steps:
  - name: "python:3.11-slim"
    id: "python-syntax-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        python -m compileall modeling api dash_app

  - name: "python:3.11-slim"
    id: "python-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pytest -q

  - name: "gcr.io/cloud-builders/docker"
    id: "build-dash-image"
    args:
      - "build"
      - "-f"
      - "Dockerfile.dash"
      - "-t"
      - "${_IMAGE}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-dash-image"
    args:
      - "push"
      - "${_IMAGE}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-dash-service"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--project=${PROJECT_ID}"
      - "--region=${_REGION}"
      - "--image=${_IMAGE}"
      - "--platform=managed"
      - "--port=8080"
      - "--set-env-vars=API_BASE_URL=https://gauge24h-api-360668288184.europe-west3.run.app,API_TIMEOUT_SECONDS=15,GAUGE24H_THRESHOLDS_PATH=/app/config/thresholds.yaml,GAUGE24H_SEGMENTS_PATH=/app/config/segments.yaml"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--timeout=300s"
      - "--min=0"
      - "--max=2"

images:
  - "${_IMAGE}"

substitutions:
  _REGION: "europe-west3"
  _REPOSITORY: "gauge24h"
  _SERVICE_NAME: "gauge24h-dash"
  _IMAGE: "europe-west3-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/rhine-gauge24h-dashboard:commit-${SHORT_SHA}"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

timeout: "1800s"