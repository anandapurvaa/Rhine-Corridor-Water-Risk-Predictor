steps:
  - name: "python:3.11-slim"
    id: "python-syntax-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        python -m compileall daily_pipeline.py mlops ingestion modeling

  - name: "python:3.11-slim"
    id: "python-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pytest -q

  - name: "gcr.io/cloud-builders/docker"
    id: "build-production-image"
    args:
      - "build"
      - "-f"
      - "Dockerfile.daily"
      - "-t"
      - "${_IMAGE}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-production-image"
    args:
      - "push"
      - "${_IMAGE}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "update-cloud-run-job"
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "update"
      - "${_JOB_NAME}"
      - "--project=${PROJECT_ID}"
      - "--region=${_REGION}"
      - "--image=${_IMAGE}"
      - "--set-env-vars=GAUGE24H_PRED_SPLIT=production,GAUGE24H_HORIZON_HOURS=24"

images:
  - "${_IMAGE}"

substitutions:
  _REGION: "europe-west3"
  _REPOSITORY: "gauge24h"
  _JOB_NAME: "rhine-daily-pipeline"
  _IMAGE: "europe-west3-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/rhine-daily-pipeline:commit-${SHORT_SHA}"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

timeout: "1800s"